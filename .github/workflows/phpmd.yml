# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# PHPMD is a spin-off project of PHP Depend and
# aims to be a PHP equivalent of the well known Java tool PMD.
# What PHPMD does is: It takes a given PHP source code base
# and look for several potential problems within that source.
# These problems can be things like:
#   Possible bugs
#   Suboptimal code
#   Overcomplicated expressions
#   Unused parameters, methods, properties
# More details at https://phpmd.org/

name: PHPMD

on:
  push:
    paths-ignore:
      - '.agents/skills/**'
      - '.claude/skills/**'
    branches: [ "main" ]
  # Required check names must still report on skills-only pull requests.
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '35 8 * * 5'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Detect changes outside agent skills
        id: files
        uses: actions/github-script@v9
        with:
          script: |
            let runCode = true;
            if (context.eventName === 'pull_request') {
              const request = { ...context.repo, pull_number: context.payload.pull_request.number };
              const { data: before } = await github.rest.pulls.get(request);
              const files = await github.paginate(github.rest.pulls.listFiles, { ...request, per_page: 100 });
              const { data: after } = await github.rest.pulls.get(request);
              // Never skip checks with an incomplete list or a PR that changed during the query.
              const complete = files.length > 0 && files.length === before.changed_files
                && before.head.sha === context.payload.pull_request.head.sha
                && after.head.sha === before.head.sha && after.changed_files === before.changed_files;
              if (complete) {
                const isSkill = (path) => path.startsWith('.agents/skills/') || path.startsWith('.claude/skills/');
                runCode = files.some((file) => !isSkill(file.filename)
                  || (file.previous_filename && !isSkill(file.previous_filename)));
              }
            }
            core.setOutput('code', String(runCode));

  PHPMD:
    needs: changes
    # Run the required check if the detector fails; only confirmed skills-only PRs skip it.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    name: Run PHPMD scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          tools: phpmd

      - name: Run PHPMD
        run: phpmd . sarif phpmd.xml --reportfile phpmd-results.sarif --ignore-violations-on-exit
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: phpmd-results.sarif
          wait-for-processing: true
