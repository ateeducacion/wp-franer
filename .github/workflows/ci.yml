---
name: CI

on:
  pull_request:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'

# Cancel previous runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write
  checks: write

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_NO_AUDIT: 1

jobs:
  playground:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set branch name for blueprint URL
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "BRANCH_NAME=${GITHUB_HEAD_REF}" >> $GITHUB_ENV
          else
            echo "BRANCH_NAME=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Patch and encode blueprint
        run: |
          sed -i "s|refs/heads/main.zip|refs/heads/${BRANCH_NAME}.zip|g" blueprint.json
          echo "BASE64_BLUEPRINT=$(base64 -w 0 blueprint.json)" >> $GITHUB_ENV

      - name: Create Playground deployment
        uses: actions/github-script@v9
        with:
          script: |
            const playgroundUrl = `https://playground.wordpress.net/#${process.env.BASE64_BLUEPRINT}`;

            // Add to summary
            core.summary.addLink('Test in WP Playground', playgroundUrl);
            await core.summary.write();

            // Create check
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "Test on WP Playground",
              head_sha: context.payload.pull_request?.head.sha || context.sha,
              status: "completed",
              conclusion: "neutral",
              output: {
                title: "Test in WP Playground",
                summary: `[Open Playground](${playgroundUrl})`
              }
            });

            // Create deployment
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request?.head.ref || context.ref,
              required_contexts: [],
              environment: "playground",
              transient_environment: true,
              auto_merge: false
            });

            if (deployment.data.id) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.data.id,
                state: "success",
                environment_url: playgroundUrl
              });
            }

  lint_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, curl, dom, json, pdo, mysql, xml, zip
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist

      - name: Install gettext
        run: sudo apt-get install -y gettext

      - name: Check untranslated strings
        run: make check-untranslated

      - name: Run code linting (PHPCS)
        run: composer phpcs

      - name: Install npm dependencies
        run: npm ci

      - name: Start wp-env
        run: |
          # Retry to absorb transient Docker Hub registry timeouts/rate limits.
          for attempt in 1 2 3; do
            npx wp-env start && exit 0
            echo "wp-env start failed (attempt ${attempt}); retrying in 20s..."
            npx wp-env stop || true
            sleep 20
          done
          npx wp-env start

      - name: Run plugin check
        run: make check-plugin

      - name: Run PHP unit tests with coverage
        # test-php-coverage (re)starts wp-env with --xdebug=coverage and writes a
        # Clover report to artifacts/coverage/clover.xml for the Codecov upload.
        run: make test-php-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: artifacts/coverage/clover.xml
          flags: php
          slug: ateeducacion/wp-franer
          # Uploads on the protected `main` branch require a token even though the
          # organization opted out of tokens for public repos (the opt-out only
          # covers unprotected branches and fork PRs). CODECOV_TOKEN is an
          # organization secret shared with this repository.
          token: ${{ secrets.CODECOV_TOKEN }}
          # Kept non-blocking so a transient upload/rate-limit hiccup never fails CI;
          # the coverage gate is enforced by Codecov's own status checks instead.
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package.json') }}
          restore-keys: npm-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package.json') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      - name: Start wp-env
        run: |
          # Retry to absorb transient Docker Hub registry timeouts/rate limits.
          for attempt in 1 2 3; do
            npx wp-env start && exit 0
            echo "wp-env start failed (attempt ${attempt}); retrying in 20s..."
            npx wp-env stop || true
            sleep 20
          done
          npx wp-env start

      - name: Run E2E tests
        run: make test-e2e
        env:
          CI: true
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Upload E2E artifacts on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: artifacts/
          retention-days: 7
